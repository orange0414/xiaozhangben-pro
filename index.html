<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="小账本 Pro"><meta name="description" content="免费的私人记账应用，支持预算、统计和离线使用。"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><link rel="icon" href="./icons/icon-192.png"><title>小账本 Pro</title><style>

ent(125deg,#257d82,#245a77 80%);border-color:#47989b}.tag{font-size:13px;color:#a8b8cc}.feature .tag{color:#d3f8f3}.sum{font-size:clamp(24px,3.1vw,38px);font-weight:800;margin:15px 0 0;overflow-wrap:anywhere;letter-spacing:-.5px}.summary .card:not(.feature) .sum{font-size:clamp(22px,2.3vw,30px)}.dashboard{display:grid;grid-template-columns:1.35fr .9fr;gap:16px}.stack{display:grid;gap:16px;align-content:start}.panel{padding:21px;min-width:0}.panel-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.panel h3{margin:0;font-size:16px}.muted{color:#8798ae;font-size:12px}.budgetline{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.big{font-size:23px;font-weight:750}.track{height:10px;background:#27374b;overflow:hidden;border-radius:20px;margin:15px 0}.progress{height:100%;background:linear-gradient(90deg,#56d9bf,#99e6c2);width:0;transition:width .3s}.progress.over{background:#ff847b}.budget-foot{font-size:13px;color:#96abc1}.transaction{display:flex;gap:12px;align-items:center;border-bottom:1px solid #253348;padding:14px 0}.transaction:last-child{border-bottom:0}.emoji{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:#263449;flex:0 0 auto;font-size:21px}.details{flex:1;min-width:0}.details strong{display:block;font-size:14px;font-weight:650}.details small{display:block;color:#91a0b5;font-size:12px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.amt{font-size:15px;font-weight:750;white-space:nowrap}.positive{color:#79e6bd}.negative{color:#e4ecfa}.mini{padding:8px 10px;font-size:12px}.empty{padding:33px 7px;text-align:center;color:#93a3ba;line-height:1.9}.cat-row{margin:12px 0}.cat-text{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;gap:8px}.catbar{height:7px;border-radius:99px;background:#26374a;overflow:hidden}.catfill{height:100%;background:#62d6c2;border-radius:99px}.chart{display:flex;align-items:end;gap:9px;height:150px;padding:13px 0 0}.chart-month{flex:1;min-width:0;text-align:center}.chart-bar{height:115px;display:flex;justify-content:center;gap:4px;align-items:end}.chart-col{width:min(16px,35%);border-radius:5px 5px 0 0;min-height:2px}.chart-col.in{background:#64d6bd}.chart-col.out{background:#718af1}.chart-month small{font-size:11px;color:#99abc2}.legend{display:flex;justify-content:center;gap:16px;font-size:11px;color:#aebbd0;margin-top:9px}.dot{display:inline-block;border-radius:50%;height:8px;width:8px;margin-right:5px}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.toolbar input{width:100%;margin-top:10px}.modal{position:fixed;inset:0;background:#030814b8;z-index:20;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.sheet{width:100%;max-width:480px;max-height:min(90vh,860px);overflow:auto;background:#152236;border:1px solid #35445b;border-radius:22px;padding:23px}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.modal h2{font-size:19px;margin:0}.choice{display:flex;gap:5px;padding:5px;background:#0d1928;border-radius:13px}.choice button{border:0;flex:1;background:transparent;color:#aabbce;padding:10px;border-radius:10px}.choice button.active{background:#2c796f;color:white}.field{margin:16px 0}.field label{display:block;color:#aab9ca;margin-bottom:8px;font-size:13px}.field input,.field select,.field textarea{width:100%}.actions{display:flex;gap:10px;margin-top:20px}.actions>*{flex:1}.footer{padding:20px 0 30px;color:#8393aa;font-size:12px;line-height:1.8}.hidden{display:none!important}.toast{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#d6f8e8;color:#0b3735;padding:11px 18px;border-radius:12px;display:none;z-index:40;box-shadow:0 8px 30px #0006;white-space:nowrap}.toast.show{display:block}@media(max-width:730px){.app{padding-left:14px;padding-right:14px}.top{padding-top:20px}.brand h1{font-size:19px}.logo{ </style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">€</div><div><h1>小账本 <span style="color:#69dfc8">Pro</span></h1><p class="sub">每笔清楚，生活有数</p></div></div><div class="top-actions"><button class="btn" id="toolsBtn">管理</button><button class="btn primary" id="addBtn">＋ 记一笔</button></div></header><div class="section-top"><h2>月度总览</h2><input type="month" id="month" aria-label="选择月份"></div><div class="summary"><div class="card feature"><div class="tag">本月结余</div><div class="sum" id="balance">€0.00</div></div><div class="card"><div class="tag">收入</div><div class="sum positive" id="income">€0.00</div></div><div class="card"><div class="tag">支出</div><div class="sum" id="expense">€0.00</div></div></div><div class="dashboard"><section class="panel"><div class="panel-header"><h3>收支明细</h3><span class="muted" id="count">0 笔</span></div><input id="search" type="search" placeholder="搜索备注或分类" aria-label="搜索账单" style="width:100%"><div id="transactions"></div></section><div class="stack"><section class="panel"><div class="panel-header"><h3>每月预算</h3><button class="btn mini" id="budgetBtn">设置预算</button></div><div class="budgetline"><strong class="big" id="budgetSpent">€0.00</strong><span class="muted" id="budgetTotal">/ €0.00</span></div><div class="track"><div class="progress" id="budgetProgress"></div></div><div class="budget-foot" id="budgetInfo">设置预算后可查看使用进度</div></section><section class="panel"><div class="panel-header"><h3>支出分类</h3><span class="muted">当前月份</span></div><div id="categories"></div></section><section class="panel"><div class="panel-header"><h3>半年趋势</h3><span class="muted">收入 / 支出</span></div><div id="trend"></div></section></div></div><footer class="footer">🔒 账单只储存在本机浏览器中，不会上传服务器。请定期在「管理」中导出 JSON 备份。iPad 与 iPhone 不会自动同步。</footer></div>
<div class="modal" id="entryModal"><div class="sheet"><div class="modal-head"><h2 id="entryTitle">记一笔</h2><button class="btn mini" data-close="entryModal">✕</button></div><div class="choice"><button class="active" data-type="expense">支出</button><button data-type="income">收入</button></div><form id="entryForm"><div class="field"><label for="amount">金额（欧元）</label><input type="number" id="amount" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required></div><div class="field"><label for="category">分类</label><select id="category"></select></div><div class="field"><label for="date">日期</label><input type="date" id="date" required></div><div class="field"><label for="note">备注</label><input id="note" maxlength="160" placeholder="例如：午饭、房租"></div><div class="actions"><button class="btn" type="button" data-close="entryModal">取消</button><button class="btn primary" type="submit">保存记录</button></div><div class="actions"><button class="btn danger hidden" type="button" id="deleteBtn">删除此记录</button></div></form></div></div>
<div class="modal" id="budgetModal"><div class="sheet"><div class="modal-head"><h2>设置月度预算</h2><button class="btn mini" data-close="budgetModal">✕</button></div><form id="budgetForm"><div class="field"><label for="budgetAmount">本月预算（€，填 0 表示不设预算）</label><input type="number" id="budgetAmount" min="0" step="0.01" required></div><div class="actions"><button type="button" class="btn" data-close="budgetModal">取消</button><button type="submit" class="btn primary">保存预算</button></div></form></div></div>
<div class="modal" id="toolsModal"><div class="sheet"><div class="modal-head"><h2>数据管理</h2><button class="btn mini" data-close="toolsModal">✕</button></div><p class="muted" style="line-height:1.7">定期导出 JSON 文件以完整备份账单和预算。更换设备时，在新设备导入该文件即可恢复。</p><div class="actions"><button class="btn primary" id="backupBtn">导出 JSON 备份</button></div><div class="actions"><button class="btn" id="csvBtn">导出 CSV 表格</button></div><div class="actions"><button class="btn" id="restoreBtn">导入 JSON 备份</button><input id="restoreFile" type="file" accept=".json,application/json" class="hidden"></div><p class="muted" style="line-height:1.8;margin-top:18px">导入时可选择合并或替换现有数据。为了防止误操作，替换前请先备份。</p></div></div><div class="toast" id="toast" role="status"></div><script src="./app.js" defer></script></body></html>
